[project]
name = "lagents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "shangzhihao", email = "zhihao.shang@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
  "langchain>=1.2.17",
  "langchain-deepseek>=1.0.1",
  "langgraph>=1.1.10",
  "python-dotenv>=1.2.2",
]

[project.scripts]
lagents = "lagents.main:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lagents"

[tool.pyright]
include = ["src"]
exclude = [".venv", "**/__pycache__"]
venvPath = "."
venv = ".venv"
