[project]
name = "agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "shangzhihao", email = "zhihao.shang@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
  "langchain>=1.2.17",
  "langchain-deepseek>=1.0.1",
  "langgraph>=1.1.10",
  "python-dotenv>=1.2.2",
]

[project.scripts]
v01 = "agents.v01loop:main"
v02 = "agents.v02tools:main"
v03 = "agents.v03todo:main"
v04 = "agents.v04subagent:main"
v05 = "agents.v05mem:main"
v06 = "agents.v06context_compact:main"
v07 = "agents.v07skills:main"
v08 = "agents.v08bg_task:main"
v09 = "agents.v09team:main"
test-team = "test_team:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agents"

[tool.pyright]
include = ["src"]
exclude = [".venv", "**/__pycache__"]
ignore = [".venv"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pre-commit>=4.6.0",
    "types-pyyaml>=6.0.12.20260510",
]
